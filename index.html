<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DAC">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Digital Asset Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="init">
<div id="login"><div class="lbox"><div class="lg">G</div><h1>Digital Asset Center</h1><p>Devam etmek için giriş yapın</p>
<button class="btn p w" id="gbtn" type="button">Google ile giriş yap</button><div id="lerr" class="hint"></div></div></div>
<div id="busy"></div>
<div id="shade"></div>
<aside id="side"></aside>
<div id="main">
  <header id="top">
    <button class="ib" data-act="menu" aria-label="Menü"><i data-lucide="menu"></i></button>
    <div class="search"><i data-lucide="search"></i><input id="q" placeholder="Varlık, domain..." autocomplete="off"><kbd>Ctrl K</kbd><div id="sres" class="drop"></div></div>
    <div class="rel"><button class="ib" data-act="bell" aria-label="Bildirimler"><i data-lucide="bell"></i><span id="dot"></span></button><div id="bell" class="drop right"></div></div>
    <button class="avatar" id="av" data-act="goto" data-to="settings"></button>
  </header>
  <main id="view"></main>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="config.js"></script>
<script src="plans.js"></script>
<script src="app.js"></script>
<script type="module">
  // Firebase JS SDK sürümü (gstatic CDN). Güncellemek için yalnızca bu satırı değiştirin.
  const FB = "https://www.gstatic.com/firebasejs/12.18.0/";

  const firebaseConfig = {
    apiKey: "AIzaSyAOSzq3zlcU5aYV0WmGi8rpGNnh7dEw9g0",
    authDomain: "assetops-ed334.firebaseapp.com",
    projectId: "assetops-ed334",
    storageBucket: "assetops-ed334.firebasestorage.app",
    messagingSenderId: "500476048545",
    appId: "1:500476048545:web:48e4f91b78ff46eee6ace0",
    measurementId: "G-50H7YRCNNV"
  };

  // ====== GİRİŞ ANAHTARI ======
  // false: Google girişi PASİF (test modu, giriş ekranı çıkmaz, uygulama doğrudan açılır)
  // true : Google girişi AKTİF
  const LOGIN_ENABLED = true;

  const lerr = document.getElementById("lerr");
  const gbtn = document.getElementById("gbtn");
  let auth = null, provider = null, signInWithPopup = null, signOut = null;

  const ERR = {
    "auth/unauthorized-domain": "Bu alan adı Firebase'de yetkili değil (Authentication > Settings > Authorized domains listesine ekleyin).",
    "auth/operation-not-allowed": "Google girişi Firebase'de etkin değil (Authentication > Sign-in method > Google).",
    "auth/popup-blocked": "Açılır pencere engellendi, izin verip tekrar deneyin.",
    "auth/network-request-failed": "İnternet bağlantısı hatası.",
    "auth/invalid-api-key": "Firebase API anahtarı geçersiz.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "Firebase API anahtarı geçersiz veya kısıtlı.",
    "auth/too-many-requests": "Çok fazla deneme yapıldı, biraz bekleyip tekrar deneyin.",
    "auth/user-disabled": "Bu hesap devre dışı bırakılmış.",
    "auth/web-storage-unsupported": "Tarayıcı depolaması kapalı (gizli mod / çerez engeli). Ayarlardan izin verin.",
    "auth/operation-not-supported-in-this-environment": "Bu tarayıcı Google girişini desteklemiyor. Chrome veya Safari'de açın.",
    "auth/internal-error": "Firebase iç hatası. Sayfayı yenileyip tekrar deneyin."
  };

  function fatal(msg) {
    document.body.classList.remove("init", "authed");
    lerr.textContent = msg;
  }

  window.dacLogout = () => {
    if (!LOGIN_ENABLED) { if (typeof toast === "function") toast("Giriş pasif (test modu): çıkış yapılacak oturum yok", "warn"); return; }
    return signOut ? signOut(auth) : undefined;
  };
  window.dacToken = async () => (auth && auth.currentUser ? await auth.currentUser.getIdToken() : null);

  gbtn.onclick = async () => {
    lerr.textContent = "";
    if (!auth) { lerr.textContent = "Giriş servisi henüz yüklenmedi. Sayfayı yenileyin."; return; }
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
      lerr.textContent = ERR[e.code] || ("Giriş hatası: " + (e.code || e.message));
    }
  };

  (async () => {
    if (!LOGIN_ENABLED) {
      // Test modu: giriş ekranı atlanır. Daha önce Google ile girdiyseniz aynı yerel verilerle açılır.
      let uid = "test-user";
      try { uid = localStorage.getItem("dac_last_uid") || uid; } catch (e) {}
      document.body.classList.remove("init");
      document.body.classList.add("authed");
      window.dacStart({ uid, displayName: "Test Modu", email: "Google girişi pasif", photoURL: null, metadata: {} });
      return;
    }
    try {
      const [appMod, authMod] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js")]);
      const app = appMod.initializeApp(firebaseConfig);
      auth = authMod.getAuth(app);
      provider = new authMod.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      signInWithPopup = authMod.signInWithPopup; signOut = authMod.signOut;
      // Analytics isteğe bağlı: yüklenemezse girişi etkilemez
      import(FB + "firebase-analytics.js").then((m) => { try { m.getAnalytics(app); } catch (e) {} }).catch(() => {});
      authMod.onAuthStateChanged(auth, (u) => {
        if (u) { try { localStorage.setItem("dac_last_uid", u.uid); } catch (e) {} }
        document.body.classList.remove("init");
        document.body.classList.toggle("authed", !!u);
        if (u) window.dacStart(u); else window.dacStop();
      });
    } catch (e) {
      console.error("Firebase yüklenemedi:", e);
      fatal("Giriş servisi yüklenemedi (Firebase SDK). İnternet bağlantınızı, reklam engelleyiciyi ve sayfayı yenilemeyi deneyin.");
    }
  })();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
